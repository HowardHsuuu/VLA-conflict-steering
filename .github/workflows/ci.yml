name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src/causal_vla/public_results.py src/causal_vla/cross_task_*.py src/causal_vla/rollout_video.py src/causal_vla/confirmatory_video.py tests
      - run: ruff format --check src/causal_vla/public_results.py src/causal_vla/cross_task_*.py src/causal_vla/rollout_video.py src/causal_vla/confirmatory_video.py tests
      - run: mypy src/causal_vla/public_results.py
      - run: pytest -q
      - run: causal-vla-results
      - run: python -m build

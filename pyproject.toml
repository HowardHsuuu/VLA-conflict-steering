[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "causal-vla-routing"
version = "0.2.0"
description = "Cross-modal conflict monitoring and action-flow steering for VLA policies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chih-Hao Hsu" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
runtime = [
  "numpy>=2.0,<2.3",
  "torch>=2.5,<2.11",
]
video = [
  "av>=14,<17",
  "numpy>=2.0,<2.3",
]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "numpy>=2.0,<2.3",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
causal-vla-results = "causal_vla.public_results:main"
causal-vla-render-example = "causal_vla.confirmatory_video:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_vla"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github/workflows/ci.yml",
  "/.gitignore",
  "/LICENSE",
  "/README.md",
  "/assets/rollouts",
  "/configs",
  "/environments/smolvla-macos",
  "/pyproject.toml",
  "/results",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/causal_vla/public_results.py"]
